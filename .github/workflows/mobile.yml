# Phone app (mobile/): runs its tests against the real bridge, and checks that it compiles for iOS.
name: mobile

on:
  push:
    paths: ['mobile/**', 'p2p-bridge/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'p2p-bridge/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add aarch64-apple-ios
      - name: Build the bridge (the app's tests drive it)
        run: cargo build --locked --manifest-path p2p-bridge/Cargo.toml
      - name: Test (desktop build of the app)
        working-directory: mobile/src-tauri
        run: cargo test
      - name: Check the iOS build
        working-directory: mobile/src-tauri
        run: cargo check --target aarch64-apple-ios
