[package]
name = "wa-summary-mobile"
version = "0.3.0"
description = "Phone app for WhatsApp Summary: pairs with your computer by QR code and opens its dashboard over Iroh"
edition = "2024"

[lib]
# Mobile builds need a static/dynamic library; the desktop build (for testing) uses the rlib.
name = "wa_summary_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
iroh = "1.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
rand = "0.9"
httparse = "1.10"
subtle = "2.6"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5.3"

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
tempfile = "3.27.0"
