[package]
name = "p2p-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
hex = "0.4.3"
httparse = "1.10.1"
iroh = "1.5"
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
